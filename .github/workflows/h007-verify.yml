name: H007 Verify
on:
  push:
    branches: [orchestrator/h-007-r1]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare Supabase-compatible roles
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL
      - name: Apply MicroWallet migrations
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202606100001_h002_internal_microwallet.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202606110001_h006_settlement_summary.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202606120001_h007_integrated_ui_state.sql
      - name: Run focused settlement test
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/h006_settlement_summary.sql
      - name: Verify H-007 state exposes funding references
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -At -v ON_ERROR_STOP=1 <<'SQL' | grep -q 'fundings'
          select public.micro_wallet_demo_state()::text;
          SQL
      - name: Verify checkout labels and funding history UI
        run: |
          grep -q 'Pay with MicroWallet' app/components/micro-wallet-demo.tsx
          grep -q 'PayPal — top up wallet first' app/components/micro-wallet-demo.tsx
          grep -q 'PayPal funding references' app/components/micro-wallet-demo.tsx
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
